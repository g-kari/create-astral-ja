name: Validate and build translation packs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate language data
        run: node tools/validate.mjs
      - name: Check translation corruption guards
        run: node tests/translation-guards.mjs
      - name: Build resource packs
        run: node tools/build.mjs
      - name: Check ZIP integrity
        run: |
          for archive in dist/*.zip; do
            unzip -t "$archive"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: japanese-packs
          path: dist/*
          if-no-files-found: error
  legacy-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check legacy book installer on Windows PowerShell
        shell: powershell
        run: ./tests/legacy-installer.ps1
